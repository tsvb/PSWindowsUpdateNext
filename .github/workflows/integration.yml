name: Write-path integration

# Exercises the code paths that change Windows Update state (hide, unhide, download, optional install,
# service registration, policy writes, scheduled jobs, cancel) on a disposable hosted runner, which
# runs elevated. Manual and weekly only: it talks to Microsoft Update and takes several minutes.

on:
  workflow_dispatch:
    inputs:
      install:
        description: 'Also install the smallest available update'
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  write-paths:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Build module
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Confirm elevation and Windows Update service
        shell: pwsh
        run: |
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $admin = ([Security.Principal.WindowsPrincipal]$id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "Runner user: $($id.Name), elevated: $admin"
          if (-not $admin) { throw 'The runner is not elevated; the write-path tests need an administrator.' }
          Set-Service wuauserv -StartupType Manual
          Start-Service wuauserv
          Get-Service wuauserv, bits | Format-Table Name, Status -AutoSize

      - name: Write-path tests
        shell: pwsh
        env:
          PSWU_WRITE_PATHS: '1'
          PSWU_WRITE_PATHS_INSTALL: ${{ inputs.install && '1' || '0' }}
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests/Integration'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputFormat = 'NUnitXml'
          $cfg.TestResult.OutputPath = './TestResults/write-paths.xml'
          Invoke-Pester -Configuration $cfg

      - name: Collect Windows Update log
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./TestResults | Out-Null
          try { Get-WindowsUpdateLog -LogPath ./TestResults/WindowsUpdate.log -ErrorAction Stop | Out-Null } catch { Write-Host "Get-WindowsUpdateLog: $($_.Exception.Message)" }
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Microsoft-Windows-WindowsUpdateClient' } -MaxEvents 200 -ErrorAction SilentlyContinue |
            Select-Object TimeCreated, Id, Message | Format-Table -AutoSize -Wrap | Out-File ./TestResults/WindowsUpdateClient-events.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: write-path-results
          path: TestResults
