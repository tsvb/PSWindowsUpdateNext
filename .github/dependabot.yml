version: 2

# Weekly update checks. Minor and patch updates are grouped into one pull request per ecosystem;
# major updates are proposed individually. The action pins in build.yml are commit SHAs with a
# version comment, which Dependabot updates in place.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: nuget
    directory: /src/PSWindowsUpdateNext
    schedule:
      interval: weekly
    # These packages are compile-time references to assemblies that Windows PowerShell 5.1 and
    # PowerShell 7.4 supply at run time. A new major version would compile against APIs the host
    # does not have, so major updates are ignored and moved deliberately.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Named pins as well: the wildcard rule above did not stop the 10.x pull requests (#11 to #13).
      # PowerShell 7.4 ships version 8 of these; a newer reference fails to load there.
      - dependency-name: "System.Management"
        versions: [">= 9"]
      - dependency-name: "System.Security.Cryptography.ProtectedData"
        versions: [">= 9"]
      - dependency-name: "System.ServiceProcess.ServiceController"
        versions: [">= 9"]
    groups:
      nuget:
        update-types:
          - minor
          - patch

  # Test-only packages (xUnit, the test SDK, and the PowerShell SDK used to load cmdlet types).
  - package-ecosystem: nuget
    directory: /tests/PSWindowsUpdateNext.UnitTests
    schedule:
      interval: weekly
    # The tests load the module's DPAPI helpers, so keep ProtectedData on the version PowerShell 7.4 ships.
    ignore:
      - dependency-name: "System.Security.Cryptography.ProtectedData"
        versions: [">= 9"]
    groups:
      test-packages:
        update-types:
          - minor
          - patch
